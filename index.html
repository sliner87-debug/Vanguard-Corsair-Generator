<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard Corsair Generator V5</title>
    <style>
        :root {
            --bg-color: #03070d;
            --panel-bg: rgba(10, 18, 30, 0.7);
            --card-bg: rgba(20, 35, 55, 0.6);
            --border-color: rgba(60, 120, 180, 0.3);
            --border-active: #4a9eff;
            --text-main: #e0f0ff;
            --text-muted: #8aa0b5;
            --accent-pink: #ff2a75;
            --accent-silver: #c0d0e0;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(74, 158, 255, 0.05), transparent 30%), radial-gradient(circle at 90% 80%, rgba(255, 42, 117, 0.05), transparent 30%);
            padding-bottom: 50px;
        }
        .container {
            max-width: 1400px; margin: 0 auto; padding: 2rem;
            display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
        }
        header { grid-column: 1 / -1; text-align: center; margin-bottom: 1rem; }
        h1 {
            font-size: 2.8rem; margin-bottom: 0.2rem;
            background: linear-gradient(90deg, var(--accent-silver), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 2px;
        }
        p.subtitle { color: var(--text-muted); font-size: 1.1rem; }
        
        .panel {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel-title {
            font-size: 1.5rem; color: #fff; margin-top: 0; border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem; margin-bottom: 1.5rem;
        }
        
        .origin-panel { background: rgba(255, 42, 117, 0.1); padding: 15px; border-left: 4px solid var(--accent-pink); margin-top: 10px; margin-bottom: 1.5rem; border-radius: 6px; }
        .origin-option { margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .origin-option input { width: auto; margin: 0; cursor: pointer; }
        .origin-option label { margin: 0; color: #fff; text-transform: none; font-weight: normal; font-size: 0.95rem; cursor: pointer; }
        
        /* Form Elements */
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 10px; margin-bottom: 1.5rem; }
        .form-row-2 { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin-bottom: 1.5rem; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { margin-bottom: 1.5rem; }
        
        label { margin-bottom: 0.5rem; font-weight: bold; color: var(--accent-silver); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        
        select, input[type="text"] {
            width: 100%; padding: 0.8rem; box-sizing: border-box;
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);
            color: #fff; border-radius: 6px; font-size: 1rem;
        }
        select:focus, input:focus { outline: none; border-color: var(--border-active); }
        
        .search-field { position: relative; }
        .search-field::after { content: "🔍"; position: absolute; right: 10px; top: 10px; pointer-events: none; opacity: 0.5; }

        .btn {
            background: linear-gradient(135deg, var(--border-active), #2a5298);
            color: white; border: none; padding: 12px 25px;
            font-size: 1.1rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 1px;
            width: 100%; margin-bottom: 1rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(74, 158, 255, 0.4); }
        
        .btn-chaos {
            background: linear-gradient(135deg, var(--accent-pink), #8e153f);
            box-shadow: 0 4px 15px rgba(255, 42, 117, 0.3);
        }
        .btn-chaos:hover { box-shadow: 0 5px 20px rgba(255, 42, 117, 0.5); }

        /* Roster / Output Area */
        .roster-card {
            background: var(--card-bg); border-left: 4px solid var(--accent-pink);
            border-radius: 6px; padding: 1rem; margin-bottom: 1rem;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .rc-name { font-size: 1.3rem; font-weight: bold; color: #fff; margin-bottom: 0.3rem; }
        .rc-details { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; }
        
        .btn-download { background: transparent; border: 2px solid var(--border-active); color: var(--border-active); margin-top: 1rem; }
        .btn-download:hover { background: rgba(74, 158, 255, 0.1); }
        
        /* Mobile Responsiveness */
        @media (max-width: 1024px) {
            .container { 
                grid-template-columns: 1fr !important; 
                padding: 10px !important; 
                gap: 1rem !important;
            }
            .form-row, .form-row-2 { 
                grid-template-columns: 1fr !important; 
                gap: 15px !important;
            }
            h1 { font-size: 1.8rem !important; }
            .panel { padding: 1rem !important; }
            input[type="text"], select { font-size: 16px !important; } /* Prevents iOS zoom */
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vanguard Corsair Generator V5</h1>
            <p class="subtitle">Massive Master-List Database Edition (1,500+ Elements)</p>
        </header>

        <!-- Left Column -->
        <div class="panel">
            <h2 class="panel-title">The Forge</h2>
            
            <button class="btn btn-chaos" id="btn-chaos">CHAOS DRIVE: Full Random Character</button>
            <hr style="border-color: var(--border-color); margin: 1.5rem 0;">
            
            <!-- Name -->
            <div class="form-group full">
                <label>Name (Optional Custom Override)</label>
                <input type="text" id="custom-name" placeholder="Leave blank to auto-generate a corsair name">
            </div>
            
            <!-- Race Cascading Menus -->
            <div class="form-row">
                <div class="form-group">
                    <label>Race System</label>
                    <select id="race-sys"></select>
                </div>
                <div class="form-group">
                    <label>Race Category</label>
                    <select id="race-cat"></select>
                </div>
                <div class="form-group search-field">
                    <label>Type to Search Race</label>
                    <input type="text" id="race-input" list="race-list" placeholder="Search or Type custom...">
                    <datalist id="race-list"></datalist>
                </div>
            </div>

            <!-- Class Cascading Menus -->
            <div class="form-row">
                <div class="form-group">
                    <label>Class System</label>
                    <select id="class-sys"></select>
                </div>
                <div class="form-group">
                    <label>Class Category</label>
                    <select id="class-cat"></select>
                </div>
                <div class="form-group search-field">
                    <label>Type to Search Class</label>
                    <input type="text" id="class-input" list="class-list" placeholder="Search or Type custom...">
                    <datalist id="class-list"></datalist>
                </div>
            </div>

            <!-- Templates -->
            <div class="form-row-2">
                <div class="form-group">
                    <label>Template System</label>
                    <select id="tpl-sys"></select>
                </div>
                <div class="form-group search-field">
                    <label>Search Template (Optional)</label>
                    <input type="text" id="tpl-input" list="tpl-list" placeholder="Search Template or leave 'None'">
                    <datalist id="tpl-list"></datalist>
                </div>
            </div>

            <!-- Other details -->
            <div class="form-group full" style="margin-bottom: 5px;">
                <label>Origin</label>
                <select id="sel-origin"></select>
            </div>
            <div id="origin-panel" class="origin-panel" style="display:none;"></div>
            
            <div class="form-group full">
                <label>Fleet Role</label>
                <select id="sel-role"></select>
            </div>
            <div class="form-group full">
                <label>Signature Weapon</label>
                <select id="sel-weapon"></select>
            </div>
            
            <button class="btn" id="btn-draft" style="margin-top: 1rem;">Draft to Fleet (Manual Build)</button>
        </div>

        <!-- Right Column -->
        <div class="panel">
            <h2 class="panel-title">The Infinite Barracks (Roster)</h2>
            <div id="roster-list">
                <p style="color:var(--text-muted); text-align:center;">Your drafted crewmates will appear here.</p>
            </div>
            <button class="btn btn-download" id="btn-download" style="display:none;">Download Complete Roster (.md)</button>
        </div>
    </div>

        // Utilities
        function populateSelect(elId, array) {
            const select = document.getElementById(elId);
            select.innerHTML = '';
            array.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item; opt.textContent = item;
                select.appendChild(opt);
            });
        }
        function populateDatalist(elId, array) {
            const dl = document.getElementById(elId);
            dl.innerHTML = '';
            array.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                dl.appendChild(opt);
            });
        }

        // Initialize Base Dropdowns
        populateSelect('sel-origin', db.Origins);
        
        // --- DYNAMIC ORIGIN PANEL LOGIC ---
        const originSelect = document.getElementById('sel-origin');
        const originPanel = document.getElementById('origin-panel');
        
        function updateOriginPanel() {
            const val = originSelect.value;
            originPanel.innerHTML = '';
            
            if(val === 'Original Vael-Kaelor Clan') {
                originPanel.style.display = 'block';
                let html = '<label style="color:var(--accent-pink);">Vael-Kaelor Inherent Bonus (Pick One)</label>';
                db.Origin_Traits.Vael_Kaelor.forEach((t, i) => {
                    // using id attributes to link labels with inputs for easier clicking
                    let id = 'vk-' + i;
                    html += `<div class="origin-option"><input type="radio" id="${id}" name="origin-trait" value="${t}" ${i===0?'checked':''}> <label for="${id}">${t}</label></div>`;
                });
                originPanel.innerHTML = html;
            } 
            else if (val === 'Thessalan Captive - Freed') {
                originPanel.style.display = 'block';
                let html = '<label style="color:var(--accent-pink);">Thessalan Grafts (Select Multiple)</label>';
                db.Origin_Traits.Thessalan_Captive.forEach((t, i) => {
                    let id = 'tc-' + i;
                    html += `<div class="origin-option"><input type="checkbox" id="${id}" name="origin-trait-chk" value="${t}"> <label for="${id}">${t}</label></div>`;
                });
                originPanel.innerHTML = html;
            }
            else {
                originPanel.style.display = 'none';
            }
        }
        originSelect.addEventListener('change', updateOriginPanel);
        updateOriginPanel();
        
        populateSelect('sel-role', db.Roles);
        populateSelect('sel-weapon', db.Weapons);

        // --- CASCADING LOGIC FOR RACES ---
        const rSys = document.getElementById('race-sys');
        const rCat = document.getElementById('race-cat');
        const rInp = document.getElementById('race-input');
        
        populateSelect('race-sys', Object.keys(db.Races));
        
        function updateRaceCats() {
            const sys = rSys.value;
            const cats = Object.keys(db.Races[sys]);
            populateSelect('race-cat', cats);
            updateRaceList();
        }
        function updateRaceList() {
            const sys = rSys.value;
            const cat = rCat.value;
            // Remove duplicates by converting to Set and back if there are duplicated arrays in dummy data
            const list = [...new Set(db.Races[sys][cat])];
            populateDatalist('race-list', list);
            rInp.value = list[0]; 
        }
        
        rSys.addEventListener('change', updateRaceCats);
        rCat.addEventListener('change', updateRaceList);
        updateRaceCats(); // Init

        const cSys = document.getElementById('class-sys');
        const cCat = document.getElementById('class-cat');
        const cInp = document.getElementById('class-input');
        
        populateSelect('class-sys', Object.keys(db.Classes));
        
        function updateClassCats() {
            const sys = cSys.value;
            const cats = Object.keys(db.Classes[sys]);
            populateSelect('class-cat', cats);
            updateClassList();
        }
        function updateClassList() {
            const sys = cSys.value;
            const cat = cCat.value;
            const list = db.Classes[sys][cat];
            populateDatalist('class-list', list);
            cInp.value = list[0]; 
        }
        
        cSys.addEventListener('change', updateClassCats);

            const sys = tSys.value;
            const list = db.Templates[sys];
            populateDatalist('tpl-list', list);
            tInp.value = list[0];

        tSys.addEventListener('change', updateTplList);

        // --- RANDOM GENERATOR ---
        function getRandomInt(max) { return Math.floor(Math.random() * max); }
        function getRandom(arr) { return arr[getRandomInt(arr.length)]; }

        function getRandomFromNested(nestedObj) {
            const sysKey = getRandom(Object.keys(nestedObj));
            const catKey = getRandom(Object.keys(nestedObj[sysKey]));
            const item = getRandom(nestedObj[sysKey][catKey]);
            return item;
        }
        function getRandomTemplate() {
            const sysKey = getRandom(Object.keys(db.Templates));
            return getRandom(db.Templates[sysKey]);
        }

        document.getElementById('btn-chaos').addEventListener('click', () => {
            const char = {
                name: `${getRandom(db.Names_First)} ${getRandom(db.Names_Title)}`,
                origin: getRandom(db.Origins),
                originTraits: [],
                race: getRandomFromNested(db.Races),
                charClass: getRandomFromNested(db.Classes),
                template: getRandomTemplate(),
                role: getRandom(db.Roles),
                weapon: getRandom(db.Weapons)
            };
            
            if(char.origin === 'Original Vael-Kaelor Clan') {
                char.originTraits.push(getRandom(db.Origin_Traits.Vael_Kaelor));
            } else if (char.origin === 'Thessalan Captive - Freed') {
                let numGrafts = 1 + getRandomInt(4); // 1 to 4 random grafts
                let shuffled = [...db.Origin_Traits.Thessalan_Captive].sort(() => 0.5 - Math.random());
                char.originTraits = shuffled.slice(0, numGrafts);
            }
            
            roster.push(char);
            renderRoster();
        });

        // --- MANUAL DRAFT ---
        function getOriginTraits() {
            const val = document.getElementById('sel-origin').value;
            let traits = [];
            if(val === 'Original Vael-Kaelor Clan') {
                const checked = document.querySelector('input[name="origin-trait"]:checked');
                if(checked) traits.push(checked.value);
            } else if (val === 'Thessalan Captive - Freed') {
                const checks = document.querySelectorAll('input[name="origin-trait-chk"]:checked');
                checks.forEach(c => traits.push(c.value));
            }
            return traits;
        }
        
        document.getElementById('btn-draft').addEventListener('click', () => {
            let customName = document.getElementById('custom-name').value.trim();
            if(!customName) customName = `${getRandom(db.Names_First)} ${getRandom(db.Names_Title)}`;
            
            const char = {
                name: customName,
                origin: document.getElementById('sel-origin').value,
                originTraits: getOriginTraits(),
                race: document.getElementById('race-input').value || "Unknown Race",
                charClass: document.getElementById('class-input').value || "Unknown Class",
                template: document.getElementById('tpl-input').value || "None",
                role: document.getElementById('sel-role').value,
                weapon: document.getElementById('sel-weapon').value
            };
            roster.push(char);
            renderRoster();
            
            document.getElementById('custom-name').value = '';
        });

        // --- ROSTER RENDER ---
        function renderRoster() {
            const list = document.getElementById('roster-list');
            list.innerHTML = '';
            
            if(roster.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Your drafted crewmates will appear here.</p>';
                document.getElementById('btn-download').style.display = 'none';
                return;
            }
            
            roster.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = 'roster-card';
                card.innerHTML = `
                    <div class="rc-name">${char.name}</div>
                    <div class="rc-details">
                        <strong>Identity:</strong> ${char.template !== 'None' ? char.template + ' ' : ''}${char.race} | ${char.charClass}<br>
                        <strong>Origin:</strong> ${char.origin}<br>
                        ${char.originTraits && char.originTraits.length > 0 ? '<strong>Origin Traits:</strong> <em>' + char.originTraits.join(', ') + '</em><br>' : ''}
                        <strong>Role:</strong> ${char.role}<br>
                        <strong>Weapon:</strong> ${char.weapon}
                    </div>
                `;
                list.prepend(card);
            });
            
            document.getElementById('btn-download').style.display = 'block';
        }

        // --- EXPORT ---
        document.getElementById('btn-download').addEventListener('click', () => {
            let md = "# Vanguard Corsair Fleet Roster\n\n";
            roster.forEach((c, i) => {
                md += `### ${roster.length - i}. ${c.name}\n`;
                md += `* **Identity:** ${c.template !== 'None' ? c.template + ' ' : ''}${c.race} | ${c.charClass}\n`;
                md += `* **Origin:** ${c.origin}\n`;
                if(c.originTraits && c.originTraits.length > 0) md += `* **Origin Traits:** ${c.originTraits.join(', ')}\n`;
                md += `* **Fleet Role:** ${c.role}\n`;
                md += `* **Signature Weapon:** ${c.weapon}\n\n`;
                md += `***\n\n`;
            });
            
            const blob = new Blob([md], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Vanguard_Fleet_Roster_V5.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
