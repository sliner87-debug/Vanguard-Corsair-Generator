<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanguard Corsair Generator V5.1</title>
    <style>
        :root {
            --bg-color: #03070d;
            --panel-bg: rgba(10, 18, 30, 0.7);
            --card-bg: rgba(20, 35, 55, 0.6);
            --border-color: rgba(60, 120, 180, 0.3);
            --border-active: #4a9eff;
            --text-main: #e0f0ff;
            --text-muted: #8aa0b5;
            --accent-pink: #ff2a75;
            --accent-silver: #c0d0e0;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color); color: var(--text-main); font-family: var(--font-main);
            min-height: 100vh;
            background-image: radial-gradient(circle at 10% 20%, rgba(74, 158, 255, 0.05), transparent 30%), radial-gradient(circle at 90% 80%, rgba(255, 42, 117, 0.05), transparent 30%);
            padding-bottom: 50px;
        }
        .container {
            max-width: 1400px; margin: 0 auto; padding: 2rem;
            display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;
        }
        header { grid-column: 1 / -1; text-align: center; margin-bottom: 1rem; }
        h1 {
            font-size: 2.8rem; margin-bottom: 0.2rem;
            background: linear-gradient(90deg, var(--accent-silver), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: 2px;
        }
        p.subtitle { color: var(--text-muted); font-size: 1.1rem; }
        
        .panel {
            background: var(--panel-bg); backdrop-filter: blur(10px);
            border: 1px solid var(--border-color); border-radius: 12px;
            padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .panel-title {
            font-size: 1.5rem; color: #fff; margin-top: 0; border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem; margin-bottom: 1.5rem;
        }
        
        .origin-panel { background: rgba(255, 42, 117, 0.1); padding: 15px; border-left: 4px solid var(--accent-pink); margin-top: 10px; margin-bottom: 1.5rem; border-radius: 6px; }
        .origin-option { margin-bottom: 10px; display: flex; align-items: flex-start; gap: 10px; }
        .origin-option input { width: auto; margin: 4px 0 0 0; cursor: pointer; }
        .origin-option label { margin: 0; color: #fff; text-transform: none; font-weight: normal; font-size: 0.95rem; cursor: pointer; line-height: 1.3; }
        
        /* Form Elements */
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 10px; margin-bottom: 1.5rem; }
        .form-row-2 { display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; margin-bottom: 1.5rem; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { margin-bottom: 1.5rem; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
        .stat-box { text-align: center; }
        .stat-box label { font-size: 0.75rem; color: var(--accent-pink); }
        .stat-box input { text-align: center; font-weight: bold; padding: 0.5rem; }
        
        label { margin-bottom: 0.5rem; font-weight: bold; color: var(--accent-silver); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
        
        select, input[type="text"] {
            width: 100%; padding: 0.8rem; box-sizing: border-box;
            background: rgba(0,0,0,0.3); border: 1px solid var(--border-color);
            color: #fff; border-radius: 6px; font-size: 1rem;
        }
        select:focus, input:focus { outline: none; border-color: var(--border-active); }
        
        .input-with-btn { display: flex; gap: 5px; }
        
        .search-field { position: relative; }

        .btn {
            background: linear-gradient(135deg, var(--border-active), #2a5298);
            color: white; border: none; padding: 12px 25px;
            font-size: 1.1rem; font-weight: bold; border-radius: 8px;
            cursor: pointer; transition: all 0.3s ease;
            text-transform: uppercase; letter-spacing: 1px;
            width: 100%; margin-bottom: 1rem;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(74, 158, 255, 0.4); }
        
        .btn-icon { width: 45px; padding: 0; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:1.2rem; background: rgba(74,158,255,0.2); border: 1px solid var(--border-active); border-radius:6px; }
        .btn-icon:hover { background: rgba(74,158,255,0.4); }
        
        .btn-chaos {
            background: linear-gradient(135deg, var(--accent-pink), #8e153f);
            box-shadow: 0 4px 15px rgba(255, 42, 117, 0.3);
        }
        .btn-chaos:hover { box-shadow: 0 5px 20px rgba(255, 42, 117, 0.5); }

        /* Roster / Output Area */
        .roster-card {
            background: var(--card-bg); border-left: 4px solid var(--accent-pink);
            border-radius: 6px; padding: 1rem; margin-bottom: 1rem;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        .rc-name { font-size: 1.3rem; font-weight: bold; color: #fff; margin-bottom: 0.3rem; }
        .rc-details { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; }
        
        .btn-download { background: transparent; border: 2px solid var(--border-active); color: var(--border-active); margin-top: 1rem; }
        .btn-download:hover { background: rgba(74, 158, 255, 0.1); }
        
        /* Mobile Responsiveness */
        @media (max-width: 1024px) {
            .container { 
                grid-template-columns: 1fr !important; 
                padding: 10px !important; 
                gap: 1rem !important;
            }
            .form-row, .form-row-2 { 
                grid-template-columns: 1fr !important; 
                gap: 15px !important;
            }
            h1 { font-size: 1.8rem !important; }
            .panel { padding: 1rem !important; }
            input[type="text"], select { font-size: 16px !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vanguard Corsair Generator V5.1</h1>
            <p class="subtitle">Massive Master-List Database Edition (1,500+ Elements)</p>
        </header>

        <!-- Left Column -->
        <div class="panel">
            <h2 class="panel-title">The Forge</h2>
            
            <button class="btn btn-chaos" type="button" id="btn-chaos">CHAOS DRIVE: Full Random Character</button>
            <hr style="border-color: var(--border-color); margin: 1.5rem 0;">
            
            <!-- Name -->
            <div class="form-group full">
                <label>Name (Optional Custom Override)</label>
                <input type="text" id="custom-name" placeholder="Leave blank to auto-generate a corsair name">
            </div>
            
            <!-- Attributes -->
            <div class="form-group full" style="margin-bottom: 1.5rem; background: rgba(255, 42, 117, 0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(255, 42, 117, 0.2);">
                <label style="color:var(--text-main); font-size:1.1rem; border-bottom: 1px solid rgba(255,42,117,0.3); padding-bottom:5px; margin-bottom:10px;">Attributes</label>
                <div class="form-row-2" style="margin-bottom: 10px;">
                    <select id="roll-method">
                        <option value="standard">Standard (4d6 Drop 1)</option>
                        <option value="classic">Classic (3d6 Straight)</option>
                        <option value="heroic">Heroic (2d6 + 6)</option>
                    </select>
                    <button class="btn btn-icon" type="button" id="btn-roll-stats" style="width:100%; font-size: 0.95rem; margin:0;">Roll Attributes 🎲</button>
                </div>
                <div class="stat-grid">
                    <div class="stat-box"><label>STR</label><input type="number" id="stat-str" value="10"></div>
                    <div class="stat-box"><label>DEX</label><input type="number" id="stat-dex" value="10"></div>
                    <div class="stat-box"><label>CON</label><input type="number" id="stat-con" value="10"></div>
                    <div class="stat-box"><label>INT</label><input type="number" id="stat-int" value="10"></div>
                    <div class="stat-box"><label>WIS</label><input type="number" id="stat-wis" value="10"></div>
                    <div class="stat-box"><label>CHA</label><input type="number" id="stat-cha" value="10"></div>
                </div>
            </div>

            <!-- Race Cascading Menus -->
            <div class="form-row">
                <div class="form-group">
                    <label>Race System</label>
                    <select id="race-sys"></select>
                </div>
                <div class="form-group">
                    <label>Race Category</label>
                    <select id="race-cat"></select>
                </div>
                <div class="form-group search-field">
                    <label>Type to Search Race</label>
                    <div class="input-with-btn">
                        <input type="text" id="race-input" list="race-list" placeholder="Search or Type custom...">
                        <button class="btn-icon" onclick="openSRD('race-sys', 'race-input')" title="View Rules in SRD">📖</button>
                    </div>
                    <datalist id="race-list"></datalist>
                </div>
            </div>

            <!-- Class Cascading Menus -->
            <div class="form-row">
                <div class="form-group">
                    <label>Class System</label>
                    <select id="class-sys"></select>
                </div>
                <div class="form-group">
                    <label>Class Category</label>
                    <select id="class-cat"></select>
                </div>
                <div class="form-group search-field">
                    <label>Type to Search Class</label>
                    <div class="input-with-btn">
                        <input type="text" id="class-input" list="class-list" placeholder="Search or Type custom...">
                        <button class="btn-icon" onclick="openSRD('class-sys', 'class-input')" title="View Rules in SRD">📖</button>
                          <button class="btn-icon" type="button" id="btn-view-class-details" title="View 1-20 Class Progression">📜</button>
                    </div>
                    <datalist id="class-list"></datalist>
                </div>
            </div>

            <!-- Templates -->
            <div class="form-row-2">
                <div class="form-group">
                    <label>Template System</label>
                    <select id="tpl-sys"></select>
                </div>
                <div class="form-group search-field">
                    <label>Search Template (Optional)</label>
                    <div class="input-with-btn">
                        <input type="text" id="tpl-input" list="tpl-list" placeholder="Search Template or leave 'None'">
                        <button class="btn-icon" onclick="openSRD('tpl-sys', 'tpl-input')" title="View Rules in SRD">📖</button>
                    </div>
                    <datalist id="tpl-list"></datalist>
                </div>
            </div>

            <!-- Other details -->
            <div class="form-group full" style="margin-bottom: 5px;">
                <label>Origin</label>
                <select id="sel-origin"></select>
            </div>
            <div id="origin-panel" class="origin-panel" style="display:none;"></div>
            
            <div class="form-group full">
                <label>Fleet Role</label>
                <select id="sel-role"></select>
                <div id="role-desc" style="margin-top: 5px; font-size: 0.9rem; color: var(--border-active);"></div>
            </div>
            <div class="form-group full">
                <label>Signature Weapon</label>
                <select id="sel-weapon"></select>
                <div id="weapon-desc" style="margin-top: 5px; font-size: 0.9rem; color: var(--border-active);"></div>
            </div>
            
            <!-- Story Weapons -->
            <div class="form-group full" style="margin-bottom: 1.5rem; background: rgba(200, 160, 40, 0.05); padding: 15px; border-radius: 8px; border: 1px solid rgba(200, 160, 40, 0.3);">
                <label style="color:#e0d080; font-size:1.1rem; border-bottom: 1px solid rgba(200,160,40,0.3); padding-bottom:5px; margin-bottom:10px;">Equip Story Weapon (Optional)</label>
                <select id="sel-story-weapon">
                    <option value="None">None</option>
                </select>
                <div id="story-weapon-panel" style="display:none; margin-top: 10px;">
                    <div class="form-row-2">
                        <div class="form-group">
                            <label>Bond Status</label>
                            <select id="sw-bond">
                                <option value="Bonded">Bonded (Growing Artifact)</option>
                                <option value="Severed">Severed (Reset to +1 Artifact)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Artifact Tier</label>
                            <select id="sw-tier">
                                <option value="1">Tier 1</option>
                                <option value="2">Tier 2</option>
                                <option value="3">Tier 3</option>
                                <option value="4">Tier 4</option>
                                <option value="5">Tier 5</option>
                            </select>
                        </div>
                    </div>
                    <div id="sw-desc" style="margin-top: 10px; font-size: 0.95rem; color: #e0d080; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 4px;"></div>
                </div>
            </div>
            
            <button class="btn" type="button" id="btn-draft" style="margin-top: 1rem;">Draft to Fleet (Manual Build)</button>
        </div>

        <!-- Right Column -->
        <div class="panel">
            <h2 class="panel-title">The Infinite Barracks (Roster)</h2>
            <div id="roster-list">
                <p style="color:var(--text-muted); text-align:center;">Your drafted crewmates will appear here.</p>
            </div>
            <button class="btn btn-download" type="button" id="btn-download" style="display:none;">Download Complete Roster (.md)</button>
        </div>
    </div>

        const roster = [];

        // Utilities
        function populateSelectGrouped(elId, groups) {
            const select = document.getElementById(elId);
            select.innerHTML = '';
            for (const [groupName, items] of Object.entries(groups)) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = groupName;
                items.forEach(item => {
                    const isObj = typeof item === 'object';
                    const opt = document.createElement('option');
                    opt.value = isObj ? item.name : item;
                    opt.textContent = isObj ? item.name : item;
                    optgroup.appendChild(opt);
                });
                select.appendChild(optgroup);
            }
        }
        
        function getRandomFromCategories(catObj) {
            const catKey = getRandom(Object.keys(catObj));
            return getRandom(catObj[catKey]);
        }
        
        function getRoleObj(name) {
            for (const cat in db.Roles) {
                const found = db.Roles[cat].find(x => x.name === name);
                if (found) return found;
            }
            return null;
        }

        function populateSelect(elId, array) {
            const select = document.getElementById(elId);
            select.innerHTML = '';
            array.forEach(item => {
                const isObj = typeof item === 'object';
                const opt = document.createElement('option');
                opt.value = isObj ? item.name : item; 
                opt.textContent = isObj ? item.name : item;
                select.appendChild(opt);
            });
        }
        function populateDatalist(elId, array) {
            const dl = document.getElementById(elId);
            dl.innerHTML = '';
            array.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                dl.appendChild(opt);
            });
        }

        // --- SRD LINK LOGIC (Option A) ---
        function openSRD(sysId, inputId) {
            const sys = document.getElementById(sysId).value;
            const term = document.getElementById(inputId).value;
            if (!term || term === 'None' || sys === 'Vanguard Campaign') return;
            
            let query = term;
            if (sys.includes("Pathfinder")) {
                query = `site:d20pfsrd.com OR site:aonprd.com "${term}" mechanics stats`;
            } else {
                query = `site:dandwiki.com/wiki/SRD: OR site:d20srd.org "${term}" mechanics stats`;
            }
            
            const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            window.open(url, '_blank');
        }

        // Initialize Base Dropdowns
        populateSelect('sel-origin', db.Origins);
        
        // --- DYNAMIC ORIGIN PANEL LOGIC (Option C) ---
        const originSelect = document.getElementById('sel-origin');
        const originPanel = document.getElementById('origin-panel');
        function updateOriginPanel() {
            const val = originSelect.value;
            originPanel.innerHTML = '';
            
            const traits = db.Origin_Traits[val];
            if (traits && traits.length > 0) {
                originPanel.style.display = 'block';
                let html = `<label style="color:var(--accent-pink); margin-bottom:10px; display:block;">${val} Traits (Select Multiple)</label>`;
                traits.forEach((t, i) => {
                    let id = 'tc-' + i;
                    html += `<div class="origin-option">
                                <input type="checkbox" id="${id}" name="origin-trait-chk" value="${t.name}"> 
                                <label for="${id}"><strong style="color:var(--text-main)">${t.name}</strong><br>
                                <small style="color:var(--border-active)">Mechanic: ${t.desc}</small></label>
                             </div>`;
                });
                originPanel.innerHTML = html;
            } else {
                originPanel.style.display = 'none';
            }
        }        
        originSelect.addEventListener('change', updateOriginPanel);
        updateOriginPanel();
        
        populateSelectGrouped('sel-role', db.Roles);
        const roleSelect = document.getElementById('sel-role');
        const roleDesc = document.getElementById('role-desc');
        function updateRoleDesc() {
            const val = roleSelect.value;
            const r = getRoleObj(val);
            roleDesc.innerHTML = r ? `<em>Mechanic: ${r.desc}</em>` : '';
        }
        roleSelect.addEventListener('change', updateRoleDesc);
        updateRoleDesc();
        
        // Initialize Story Weapons
        const swSelect = document.getElementById('sel-story-weapon');
        const swPanel = document.getElementById('story-weapon-panel');
        const swBond = document.getElementById('sw-bond');
        const swTier = document.getElementById('sw-tier');
        const swDesc = document.getElementById('sw-desc');
        
        swSelect.innerHTML = '<option value="None">None</option>';
        Object.keys(db.Story_Weapons).forEach(w => {
            const opt = document.createElement('option');
            opt.value = w;
            opt.textContent = w;
            swSelect.appendChild(opt);
        });
        
        function updateStoryWeapon() {
            const val = swSelect.value;
            if (val === "None") {
                swPanel.style.display = 'none';
                return;
            }
            swPanel.style.display = 'block';
            
            const wObj = db.Story_Weapons[val];
            const isSevered = (swBond.value === 'Severed');
            
            if (isSevered) {
                swTier.disabled = true;
                swDesc.innerHTML = `<strong>${val} (Severed Bond)</strong><br><em>${wObj.description}</em><br><br><span style="color:#ff2a75">Bond Severed: All special enhancements wiped. Functions as a basic +1 Artifact Weapon.</span>`;
            } else {
                swTier.disabled = false;
                const tier = parseInt(swTier.value);
                const tierObj = wObj.tiers.find(t => t.level === tier);
                if (tierObj) {
                    swDesc.innerHTML = `<strong>${val} (Tier ${tier}: ${tierObj.name})</strong><br><em>${wObj.description}</em><br><br><span style="color:var(--border-active)">Mechanic: ${tierObj.desc}</span>`;
                }
            }
        }
        
        swSelect.addEventListener('change', updateStoryWeapon);
        swBond.addEventListener('change', updateStoryWeapon);
        swTier.addEventListener('change', updateStoryWeapon);
        
        populateSelect('sel-weapon', db.Weapons);
        const weaponSelect = document.getElementById('sel-weapon');
        const weaponDesc = document.getElementById('weapon-desc');
        function updateWeaponDesc() {
            const val = weaponSelect.value;
            const w = db.Weapons.find(x => x.name === val);
            weaponDesc.innerHTML = w ? `<em>Effect: ${w.desc}</em>` : '';
        }
        weaponSelect.addEventListener('change', updateWeaponDesc);
        updateWeaponDesc();

        // --- CASCADING LOGIC FOR RACES ---
        const rSys = document.getElementById('race-sys');
        const rCat = document.getElementById('race-cat');
        const rInp = document.getElementById('race-input');
        
        populateSelect('race-sys', Object.keys(db.Races));
        
        function updateRaceCats() {
            const sys = rSys.value;
            const cats = Object.keys(db.Races[sys]);
            populateSelect('race-cat', cats);
            updateRaceList();
        }
        function updateRaceList() {
            const sys = rSys.value;
            const cat = rCat.value;
            const list = [...new Set(db.Races[sys][cat])];
            populateDatalist('race-list', list);
            rInp.value = list[0]; 
        }
        
        rSys.addEventListener('change', updateRaceCats);
        rCat.addEventListener('change', updateRaceList);
        updateRaceCats();

        // --- CASCADING LOGIC FOR CLASSES ---
        const cSys = document.getElementById('class-sys');
        const cCat = document.getElementById('class-cat');
        const cInp = document.getElementById('class-input');
        
        populateSelect('class-sys', Object.keys(db.Classes));
        
        function updateClassCats() {
            const sys = cSys.value;
            const cats = Object.keys(db.Classes[sys]);
            populateSelect('class-cat', cats);
            updateClassList();
        }
        function updateClassList() {
            const sys = cSys.value;
            const cat = cCat.value;
            const list = db.Classes[sys][cat];
            populateDatalist('class-list', list);
            cInp.value = list[0]; 
        }
        
        cSys.addEventListener('change', updateClassCats);
        cCat.addEventListener('change', updateClassList);
        updateClassCats();

        // --- CASCADING LOGIC FOR TEMPLATES ---
        const tSys = document.getElementById('tpl-sys');
        const tInp = document.getElementById('tpl-input');
        
        populateSelect('tpl-sys', Object.keys(db.Templates));
        
        function updateTplList() {
            const sys = tSys.value;
            const list = db.Templates[sys];
            populateDatalist('tpl-list', list);
            tInp.value = list[0];
        }
        tSys.addEventListener('change', updateTplList);
        updateTplList();


        // --- RANDOM GENERATOR ---
        function rollD6() { return Math.floor(Math.random() * 6) + 1; }
        function generateStat(method) {
            if (method === 'standard') {
                let rolls = [rollD6(), rollD6(), rollD6(), rollD6()].sort((a,b) => a-b);
                return rolls[1] + rolls[2] + rolls[3];
            } else if (method === 'heroic') {
                return rollD6() + rollD6() + 6;
            } else {
                return rollD6() + rollD6() + rollD6();
            }
        }
        function generateStatArray(method) {
            return [generateStat(method), generateStat(method), generateStat(method), generateStat(method), generateStat(method), generateStat(method)];
        }
        
        document.getElementById('btn-roll-stats').addEventListener('click', () => {
            const method = document.getElementById('roll-method').value;
            const stats = generateStatArray(method);
            document.getElementById('stat-str').value = stats[0];
            document.getElementById('stat-dex').value = stats[1];
            document.getElementById('stat-con').value = stats[2];
            document.getElementById('stat-int').value = stats[3];
            document.getElementById('stat-wis').value = stats[4];
            document.getElementById('stat-cha').value = stats[5];
        });

        function getRandomInt(max) { return Math.floor(Math.random() * max); }
        function getRandom(arr) { return arr[getRandomInt(arr.length)]; }

        function getRandomFromNested(nestedObj) {
            const sysKey = getRandom(Object.keys(nestedObj));
            const catKey = getRandom(Object.keys(nestedObj[sysKey]));
            const item = getRandom(nestedObj[sysKey][catKey]);
            return item;
        }
        function getRandomTemplate() {
            const sysKey = getRandom(Object.keys(db.Templates));
            return getRandom(db.Templates[sysKey]);
        }

        document.getElementById('btn-chaos').addEventListener('click', () => {
            const randWeapon = getRandom(db.Weapons);
            const randRole = getRandomFromCategories(db.Roles);
            let sWeaponText = null;
            if (document.getElementById('sel-story-weapon').value !== "None") {
                const swName = document.getElementById('sel-story-weapon').value;
                const swData = db.Story_Weapons[swName];
                const isSevered = (document.getElementById('sw-bond').value === 'Severed');
                if (isSevered) {
                    sWeaponText = `${swName} (Severed Bond) — ${swData.description} [All bonuses wiped. Reset to basic +1 Artifact Weapon]`;
                } else {
                    const tierLvl = parseInt(document.getElementById('sw-tier').value);
                    const tObj = swData.tiers.find(t => t.level === tierLvl);
                    sWeaponText = `${swName} (Tier ${tierLvl}: ${tObj.name}) — ${swData.description} [${tObj.desc}]`;
                }
            }
            
            const char = {
                name: `${getRandom(db.Names_First)} ${getRandom(db.Names_Title)}`,
                origin: getRandom(db.Origins),
                originTraits: [],
                race: getRandomFromNested(db.Races),
                charClass: getRandomFromNested(db.Classes),
                template: getRandomTemplate(),
                role: `${randRole.name} — ${randRole.desc}`,
                weapon: `${randWeapon.name} — ${randWeapon.desc}`,
                stats: generateStatArray('standard')
            };
            if (db.Origin_Traits[char.origin]) {
                let traits = db.Origin_Traits[char.origin];
                let numGrafts = 1 + getRandomInt(Math.min(3, traits.length));
                let shuffled = [...traits].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, numGrafts);
                selected.forEach(t => char.originTraits.push(`${t.name} (${t.desc})`));
            }            
            
            roster.push(char);
            renderRoster();
        });

        // --- MANUAL DRAFT ---
        function getOriginTraits() {
            const val = document.getElementById('sel-origin').value;
            let chosenTraits = [];
            
            if (db.Origin_Traits[val]) {
                const checks = document.querySelectorAll('input[name="origin-trait-chk"]:checked');
                checks.forEach(c => {
                    const trait = db.Origin_Traits[val].find(t => t.name === c.value);
                    if (trait) {
                        chosenTraits.push(`${trait.name} (${trait.desc})`);
                    }
                });
            }
            return chosenTraits;
        }
        
        document.getElementById('btn-draft').addEventListener('click', () => {
            let customName = document.getElementById('custom-name').value.trim();
            if(!customName) customName = `${getRandom(db.Names_First)} ${getRandom(db.Names_Title)}`;
            
            const wName = document.getElementById('sel-weapon').value;
            const wObj = db.Weapons.find(x => x.name === wName);
            
            const rName = document.getElementById('sel-role').value;
            const rObj = getRoleObj(rName);
            
            let sWeaponText = null;
            if (document.getElementById('sel-story-weapon').value !== "None") {
                const swName = document.getElementById('sel-story-weapon').value;
                const swData = db.Story_Weapons[swName];
                const isSevered = (document.getElementById('sw-bond').value === 'Severed');
                if (isSevered) {
                    sWeaponText = `${swName} (Severed Bond) — ${swData.description} [All bonuses wiped. Reset to basic +1 Artifact Weapon]`;
                } else {
                    const tierLvl = parseInt(document.getElementById('sw-tier').value);
                    const tObj = swData.tiers.find(t => t.level === tierLvl);
                    sWeaponText = `${swName} (Tier ${tierLvl}: ${tObj.name}) — ${swData.description} [${tObj.desc}]`;
                }
            }
            
            const char = {
                name: customName,
                origin: document.getElementById('sel-origin').value,
                originTraits: getOriginTraits(),
                race: document.getElementById('race-input').value || "Unknown Race",
                charClass: document.getElementById('class-input').value || "Unknown Class",
                template: document.getElementById('tpl-input').value || "None",
                role: rObj ? `${rObj.name} — ${rObj.desc}` : rName,
                weapon: wObj ? `${wObj.name} — ${wObj.desc}` : wName,
                stats: [
                    document.getElementById('stat-str').value || 10,
                    document.getElementById('stat-dex').value || 10,
                    document.getElementById('stat-con').value || 10,
                    document.getElementById('stat-int').value || 10,
                    document.getElementById('stat-wis').value || 10,
                    document.getElementById('stat-cha').value || 10
                ]
            };
            roster.push(char);
            renderRoster();
            
            document.getElementById('custom-name').value = '';
        });

        // --- ROSTER RENDER ---
        function renderRoster() {
            const list = document.getElementById('roster-list');
            list.innerHTML = '';
            
            if(roster.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Your drafted crewmates will appear here.</p>';
                document.getElementById('btn-download').style.display = 'none';
                return;
            }
            
            roster.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = 'roster-card';
                card.innerHTML = `
                    <div class="rc-name">${char.name}</div>
                    <div class="rc-details">
                        <strong>Identity:</strong> ${char.template !== 'None' ? char.template + ' ' : ''}${char.race} | ${char.charClass}<br>
                        <strong>Origin:</strong> ${char.origin}<br>
                        ${char.originTraits && char.originTraits.length > 0 ? '<strong>Origin Traits:</strong> <em>' + char.originTraits.join(', ') + '</em><br>' : ''}
                        <strong>Role:</strong> ${char.role}<br>
                        <strong>Weapon:</strong> ${char.weapon}
                        <div style="margin-top: 8px; background: rgba(0,0,0,0.4); padding: 5px; border-radius: 4px; display:flex; justify-content:space-around; text-align:center;">
                            <span><small style="color:var(--accent-pink)">STR</small><br><b style="color:#fff">${char.stats[0]}</b></span>
                            <span><small style="color:var(--accent-pink)">DEX</small><br><b style="color:#fff">${char.stats[1]}</b></span>
                            <span><small style="color:var(--accent-pink)">CON</small><br><b style="color:#fff">${char.stats[2]}</b></span>
                            <span><small style="color:var(--accent-pink)">INT</small><br><b style="color:#fff">${char.stats[3]}</b></span>
                            <span><small style="color:var(--accent-pink)">WIS</small><br><b style="color:#fff">${char.stats[4]}</b></span>
                            <span><small style="color:var(--accent-pink)">CHA</small><br><b style="color:#fff">${char.stats[5]}</b></span>
                        </div>
                    </div>
                `;
                list.prepend(card);
            });
            
            document.getElementById('btn-download').style.display = 'block';
        }

        // --- EXPORT ---
        document.getElementById('btn-download').addEventListener('click', () => {
            let md = "# Vanguard Corsair Fleet Roster\n\n";
            roster.forEach((c, i) => {
                md += `### ${roster.length - i}. ${c.name}\n`;
                md += `* **Identity:** ${c.template !== 'None' ? c.template + ' ' : ''}${c.race} | ${c.charClass}\n`;
                md += `* **Origin:** ${c.origin}\n`;
                if(c.originTraits && c.originTraits.length > 0) md += `* **Origin Traits:** ${c.originTraits.join('; ')}\n`;
                md += `* **Fleet Role:** ${c.role}\n`;
                md += `* **Signature Weapon:** ${c.weapon}\n`;
                if(c.stats) md += `* **Attributes:** STR ${c.stats[0]} | DEX ${c.stats[1]} | CON ${c.stats[2]} | INT ${c.stats[3]} | WIS ${c.stats[4]} | CHA ${c.stats[5]}\n\n`;
                else md += `\n`;
                md += `***\n\n`;
            });
            
            const blob = new Blob([md], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Vanguard_Fleet_Roster_V5-1.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>

            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-active); padding-bottom:10px; margin-bottom:15px;">
                <h2 id="modal-class-title" style="color:var(--accent-pink); margin:0;">Class Name</h2>
                <button type="button" onclick="document.getElementById('class-modal').style.display='none'" style="background:transparent; color:var(--text-main); border:1px solid var(--accent-cyan); padding:4px 12px; cursor:pointer;">Close [X]</button>
            </div>
            <p id="modal-class-desc" style="color:var(--text-main); font-style:italic; margin-bottom:20px;">Description</p>
            <div id="modal-class-table-container"></div>
        </div>
    </div>

</body>
</html>
